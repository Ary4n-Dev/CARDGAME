<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="soft-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#2a201c" flood-opacity="0.18" />
    </filter>
  </defs>
  <!-- Card background (Cream playing card) -->
  <rect x="6" y="2" width="52" height="60" rx="10" fill="#FAF7F2" stroke="#D8CFC4" stroke-width="2.5" filter="url(#soft-shadow)"/>
  
  <!-- Subtle inner frame border -->
  <rect x="9.5" y="5.5" width="45" height="53" rx="7.5" fill="none" stroke="#EFE9DE" stroke-width="1.2"/>

  <!-- Top-left tiny suit corner -->
  <text x="12" y="16" font-family="'Gaegu', cursive, sans-serif" font-size="11" font-weight="bold" fill="#E05C73">A</text>
  <path d="M15 19 C15 17.8 16.2 17 17.2 18 C18.2 17 19.4 17.8 19.4 19 C19.4 20.4 17.2 22 17.2 22 C17.2 22 15 20.4 15 19 Z" fill="#E05C73"/>

  <!-- Bottom-right inverted tiny suit corner -->
  <g transform="rotate(180 52 48)">
    <text x="50" y="47" font-family="'Gaegu', cursive, sans-serif" font-size="11" font-weight="bold" fill="#3A5A8C">A</text>
    <path d="M53 50 C51.6 51.5 49.8 53 49.8 54 C49.8 55 50.7 55.6 51.7 55.6 C52.4 55.6 53 55.1 53 55.1 C53 55.1 53.6 55.6 54.3 55.6 C55.3 55.6 56.2 55 56.2 54 C56.2 53 54.4 51.5 53 50 Z" fill="#3A5A8C"/>
  </g>

  <!-- Center Double Playing Card Fan Crest -->
  <!-- Left card (Spade blue) -->
  <rect x="18" y="20" width="20" height="27" rx="3.5" fill="#EEF4FC" stroke="#3A5A8C" stroke-width="1.8" transform="rotate(-12 28 33)"/>
  <path d="M26 27 C24.2 29 22 31 22 32.5 C22 33.8 23.2 34.6 24.5 34.6 C25.5 34.6 26 34 26 34 C26 34 26.5 34.6 27.5 34.6 C28.8 34.6 30 33.8 30 32.5 C30 31 27.8 29 26 27 Z" fill="#3A5A8C" transform="rotate(-12 28 33)"/>
  <path d="M25.5 34 L25 36.5 H27 L26.5 34 Z" fill="#3A5A8C" transform="rotate(-12 28 33)"/>

  <!-- Right card (Heart pink) -->
  <rect x="26" y="19" width="20" height="27" rx="3.5" fill="#FFF0F3" stroke="#E05C73" stroke-width="1.8" transform="rotate(14 36 32)"/>
  <path d="M36 26 C36 24.2 38 23 39.5 24.5 C41 23 43 24.2 43 26 C43 28.5 39.5 31 39.5 31 C39.5 31 36 28.5 36 26 Z" fill="#E05C73" transform="rotate(14 36 32)"/>

  <!-- Sparkle accents -->
  <path d="M49 13 L50.2 16 L53 17 L50.2 18 L49 21 L47.8 18 L45 17 L47.8 16 Z" fill="#F4C430"/>
  <circle cx="15" cy="46" r="1.5" fill="#7DDCB5"/>
</svg>
